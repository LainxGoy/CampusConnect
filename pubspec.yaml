name: campus_connect
description: "Plataforma móvil universitaria para gestión y seguimiento de solicitudes institucionales."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Conectividad y Red
  dio: ^5.4.1
  http_parser: ^4.0.2

  # Gestión de Estado
  provider: ^6.1.2

  # Persistencia Segura y Almacenamiento Local
  flutter_secure_storage: ^9.0.0

  # Manejo Multimedia y Archivos
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  path: ^1.9.0

  # Utilidades y Formato
  intl: ^0.19.0
  equatable: ^2.0.5

  # Iconografía e UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
